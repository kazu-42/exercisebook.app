name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, types, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.8.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit

      - name: Verify exact TypeScript baseline
        shell: bash
        run: |
          actual="$(pnpm exec tsc --version)"
          expected="Version 7.0.2"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Expected $expected, resolved $actual"
            exit 1
          fi
          echo "$actual"

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Check generated schemas
        run: pnpm schema:check

      - name: Check compiled content
        run: pnpm content:check

      - name: Check dependency boundaries
        run: pnpm check:boundaries

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check reviewed launch bundle
        run: pnpm check:launch-bundle

      - name: Generate and verify sample artifacts
        run: pnpm worksheet:samples

  browser-smoke:
    name: Production bundle browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.8.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
          cache: pnpm

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Build primary Worker
        run: pnpm --filter @exercisebook/web build

      - name: Install Chromium
        run: uv run --with playwright playwright install --with-deps chromium

      - name: Run production-preview browser smoke
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @exercisebook/web preview --host 127.0.0.1 --port 5173 > /tmp/exercisebook-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5173/api/health > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat /tmp/exercisebook-preview.log
              exit 1
            fi
            sleep 1
          done
          uv run --with playwright python scripts/launch-browser-smoke.py

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: learning-new-v1-browser-smoke
          path: output/browser-smoke/
          if-no-files-found: ignore
