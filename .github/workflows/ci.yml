name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, types, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.8.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Verify exact TypeScript baseline
        shell: bash
        run: |
          actual="$(pnpm exec tsc --version)"
          expected="Version 7.0.2"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Expected $expected, resolved $actual"
            exit 1
          fi
          echo "$actual"

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Check generated schemas
        run: pnpm schema:check

      - name: Check compiled content
        run: pnpm content:check

      - name: Check dependency boundaries
        run: pnpm check:boundaries

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Generate and verify sample artifacts
        run: pnpm worksheet:sample
